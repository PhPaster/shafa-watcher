name: shafa-watch

on:
  # Самозапуск — три шари (README → «Самозапуск»):
  #   1. Google Apps Script (tools/trigger.gs) — workflow_dispatch кожні 10 хв, + сторож у Telegram;
  #   2. Cloudflare Worker (tools/cloudflare-worker.js) — workflow_dispatch кожні 10 хв;
  #   3. цей розклад — раз на 2 год, але перевірка йде, лише якщо 1 і 2 мовчать 15+ хв (задача gate).
  # Зовнішні тригери мають замок (останній запуск < 9 хв тому → пропуск), тож запусків ~1 на 10 хв.
  # Розклад GitHub частіше не ставити: кожен його запуск — щонайменше 1 хв задачі gate (квота $12/міс).
  schedule:
    - cron: "41 */2 * * *"
  workflow_dispatch:
    inputs:
      demo:
        description: "Надіслати N найсвіжіших відповідних товарів (перевірка вигляду), 0 = звичайний запуск"
        default: "0"
      backfill:
        description: "Разово: усі бренди, надіслати відповідні речі за останні N годин (напр. 72), 0 = звичайний запуск"
        default: "0"
      only:
        description: "Лише групи, у назві правила яких є цей текст (напр. «Пухові»); порожньо = усі"
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: shafa-watch
  cancel-in-progress: false

jobs:
  # Лише для розкладу GitHub (резервний шар): чи були запуски від зовнішніх тригерів за останні 15 хв.
  gate:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-slim
    timeout-minutes: 2
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timezone
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/workflows/watch.yml/runs?per_page=10",
              headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json"})
          runs = [r for r in json.load(urllib.request.urlopen(req, timeout=20))["workflow_runs"]
                  if str(r["id"]) != os.environ["GITHUB_RUN_ID"]]
          now = datetime.now(timezone.utc)
          age = min(((now - datetime.fromisoformat(r["created_at"].replace("Z", "+00:00"))).total_seconds() / 60
                     for r in runs), default=1e9)
          run = age >= 15
          print(f"останній інший запуск {age:.0f} хв тому → {'зовнішні тригери мовчать, запускаю перевірку' if run else 'резерв не потрібен'}")
          if run:
              print("::warning::зовнішні тригери (Apps Script, Cloudflare) не запускали воркфлоу 15+ хв — спрацював резерв GitHub")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"run={'1' if run else '0'}\n")
          PY

  watch:
    needs: gate
    # dispatch: gate пропущено → запуск; schedule: якщо gate сказав run=1 або сам упав (краще зайвий запуск, ніж жодного).
    if: ${{ !cancelled() && (needs.gate.result != 'success' || needs.gate.outputs.run == '1') }}
    # ubuntu-slim: 1 vCPU, найдешевший раннер ($0.002/хв проти $0.006 у ubuntu-latest).
    runs-on: ubuntu-slim
    # довантаження (backfill) — довгий разовий прохід: сотні запитів із паузами й надсилання в Telegram
    timeout-minutes: ${{ github.event.inputs.backfill && github.event.inputs.backfill != '0' && 40 || 8 }}
    steps:
      - uses: actions/checkout@v4

      - name: Завантажити стан
        run: |
          if git fetch --depth=1 origin state 2>/dev/null; then
            git show FETCH_HEAD:state.json > state.json
            echo "стан завантажено: $(wc -c < state.json) байт"
          else
            echo "гілки state ще немає — перший запуск лише запам'ятає товари"
          fi

      - name: Встановити залежності
        run: python3 -m pip install --quiet --disable-pip-version-check -r requirements.txt || python3 -m pip install --quiet --break-system-packages -r requirements.txt

      - name: Перевірка Shafa
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          ONLY: ${{ github.event.inputs.only || '' }}
        run: python3 -m shafa_watch --demo "${{ github.event.inputs.demo || '0' }}" --backfill "${{ github.event.inputs.backfill || '0' }}" --only "$ONLY"

      - name: Зберегти зміни з Telegram у brands.yaml
        if: always() && hashFiles('.bot_changes') != ''
        run: |
          git config user.name "shafa-watch-bot"
          git config user.email "shafa-watch-bot@users.noreply.github.com"
          git add brands.yaml
          git commit -qm "Бот: $(paste -sd ';' .bot_changes)"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep 5
          done
          echo "::error::не вдалося запушити brands.yaml"; exit 1

      - name: Зберегти стан у гілку state
        if: always() && hashFiles('state.json') != ''
        run: |
          git config user.name "shafa-watch-bot"
          git config user.email "shafa-watch-bot@users.noreply.github.com"
          cp state.json "$RUNNER_TEMP/state.json"
          git checkout --orphan state-tmp
          git rm -rq --cached .
          cp "$RUNNER_TEMP/state.json" state.json
          git add -f state.json
          git commit -qm "state $(date -u +%FT%TZ)"
          git push -qf origin HEAD:state
