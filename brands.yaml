searches:
  # id матеріалу різні в різних категоріях (python tools/lookup.py materials rubashki / bryuki)
  - name: Лляні сорочки
    categories: [сорочки]
    materials: [1712]                 # «Льон» у сорочках (серверний фільтр: поле «Матеріал»)
  - name: Лляні брюки
    categories: [брюки]
    materials: [1967]                 # «Льон» у штанах
  - name: Шовкові сорочки
    categories: [сорочки]
    materials: [1725]                 # «Шовк» у сорочках
  # 10.11.2026: вовняні светри без бренду лише з країною/пряжею в назві (~10/добу), піжами (~4/добу),
  # вовняні шапки всіх брендів зі списку (розміри 59/60 і One size; id розмірів і матеріалів шапок — інші)
  # 11.11.2026: усі вовняні светри в моїх розмірах (L/XL, поле «Матеріал» — вовна/кашемір/альпака), будь-який
  # бренд або без бренду. Країна/пряжа/меринос у назві чи описі — ⭐ і звук, решта — тихо.
  - name: 'Вовняні светри (без бренду)'
    categories: [светри]
    materials: [вовна, кашемір, альпака, ангора]   # 11.11: + ангора (сервер приймає й 4–5 id)
    title_prefer: made\s*in\s*(ireland|scotland|england|great\s*britain|britain|uk|italy|japan|norway|iceland)|british|британ|ірланд|ирланд|шотланд|англі|італі|итали|япон|норвез|ісланд|\baran\b|\bаран|shetland|шетланд|fair\s*isle|lambswool|ламбсвул|cashmere|кашемір|кашемир|альпак|alpaca|mohair|мохер|camel|merino|мерино
  # 11.11.2026: зимові куртки з натуральним пухом — увесь верхній одяг (пуховики, куртки, парки, жилети, пальто),
  # будь-який бренд, L/XL. «Утеплювач» (46): Пух+перо 1791, Перо 1789, Натуральний пух 1787 (id однакові в
  # пуховиках і куртках). ~100/тиждень до фільтра продавця, 3/4 — пуховики.
  - name: Пухові куртки
    categories: [верхній одяг]
    materials: [1791, 1789, 1787]
  # 11.11.2026: якісні речі з натуральних тканин і шкіри будь-якого бренду (id матеріалів — свої в кожній
  # підкатегорії: туфлі 40, черевики 48, мокасини 65, пальта 47, куртки 59, піджаки 20, брюки 54).
  # min_share — якщо склад указано відсотками, натуральних волокон (вовна, кашемір, шовк, льон…) ≥50 %.
  - name: Вовняні брюки
    categories: [брюки]
    materials: [1980, 1963, 1975]          # вовна, кашемір, твід
    min_share: 50
