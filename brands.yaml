# База брендів Shafa Watcher. Згенеровано з data/brand_survey.json (опитування 9.11.2026) і списку
# «Бренди для моніторингу Shafa / OLX». Далі редагуй тут або командами бота (/add, /remove, /off…).
# Бренд без id → python tools/lookup.py fill. Категорії: python tools/lookup.py categories

settings:
  items_per_query: 100        # найновіших товарів за запит (сервер приймає до 500)
  max_pages: 3                # догортати, якщо вся сторінка нова
  backfill_hours: 72          # перший прохід нового бренду / зміненого фільтра: надіслати речі за 72 год (0 — лише запам'ятати)
  backfill_max_pages: 5       # скільки сторінок гортати при довантаженні
  request_delay_sec: 1.5      # пауза між запитами до Shafa
  photos: 3                   # 1 = фото з кнопкою; 2–10 = альбом
  heartbeat_hour_kyiv: 9      # щоденний звіт «я працюю» після цієї години
  empty_runs_alert: 12        # алерт, якщо група, що мала товари, повертає 0 стільки запусків поспіль
  max_brands_per_query: 100   # перевірено: сервер приймає 100 id брендів в одному запиті
  max_slow_requests_per_run: 40 # скільки груп повільних пакетів можна за прохід (10.11: було 6; групи йдуть пачками)
  aliases_per_request: 10     # скільки аліасів (група × варіант продавця) в одному HTTP-запиті до Shafa
  # Чорний список продавців (логін зі сторінки shafa.ua/uk/member/<логін> або id): їхні речі не надсилаються.
  blocked_sellers:
    - ivan.vusik              # id 1502008; 11.11.2026: нереальні ціни, спам однотипних оголошень
  # Пакети: як часто опитувати (хвилини). Воркфлоу запускається кожні 10 хв. 10.11.2026: частіше, бо групи
  # тепер ідуть пачками (аліаси GraphQL) — кількість HTTP-запитів за прохід майже не зросла.
  packages:
    гарячі: 10
    звичайні: 10
    рідкісні: 10
    тихі: 30
    не мої розміри: 180
    сплячі: 1440
    текст щодня: 180
    текст щотижня: 1440

# Профіль розмірів: діє для всіх брендів і пошуків (серверний фільтр).
my_sizes:
  одяг: [L, XL]
  штани: [W34, W36, W38]       # пояс від ~45 см (напівобхват)
  взуття: [45, 45.5, 46]       # устілка ~29 см

# Мірки з опису: якщо продавець їх указав і вони не підходять — річ відсіюється. Не вказав — проходить.
measurements:
  waist_half_min: 45           # пояс (напівобхват), см; повний обхват ділиться на 2
  length_min: 110              # довжина штанів, см
  length_soft: 3               # 12.11.2026: на 1–3 см коротші (107–109) — не відсів, а тихо
  inseam_min: 80               # довжина по внутрішньому шву, см (L32 ≈ 81 см)
  insole: [28.5, 30]           # устілка взуття, см

# Матеріали за категоріями (для всіх брендів і пошуків): only — лише такі; prefer — ⭐ і звук, решта тихо.
category_materials:
  # 11.11.2026: олімпійки й зіпки — будь-яка тканина (як худі); матеріал не вказано — надіслати тихо;
  # min_share — якщо склад указано відсотками («76% бавовна 7% вовна»), вовни/кашеміру/альпаки/ангори ≥50 %
  светри: {only: [вовна, кашемір, альпака, ангора], except: [худі, олімпійки], if_unknown: send, min_share: 50}
  # шапки (пошук «Шапки»): та сама частка вовни; альпаки серед матеріалів шапок на Shafa немає
  holovni-ubory/shapky: {only: [вовна, кашемір, альпака, ангора], if_unknown: send, min_share: 50}
  взуття: {prefer: [шкіра, замша, нубук]}
  піжами: {prefer: [бавовна, льон, шовк, вовна, кашемір]}

# За замовчуванням для всіх брендів і пошуків (кожен може перевизначити).
defaults:
  section: men
  min_condition: 3            # 1 Новий, 2 Ідеальний, 3 Дуже хороший, 4 Хороший, 5 Задовільний (3 = «3 і краще»)
  max_age_hours: 72           # ігнорувати «підняті» оголошення, створені раніше
  seller: private_new         # нові речі — лише від приватних осіб (без реплік від магазинів), вживані — від усіх;
                              # private — лише приватні; any — усі. У Telegram: /seller
  package: звичайні           # пакет для нових брендів (/add)
  # reseller_filter: true     # за замовчуванням: відсіювати «нові s-xl», репліки, опт
  also_categories: [худі]     # додається до категорій кожного бренду (10.11.2026); бренд вимикає: also_categories: []
  # 12.11.2026: жіночі речі, що потрапили в чоловічий розділ («Жіночий светр 100% кашемір»). «Чоловіча/жіноча»
  # і «унісекс» не відсіюються. Правило зі своїм keywords_exclude (Ralph Lauren, шапки, піжами) — замість цього.
  keywords_exclude: ^(?!.*(чоловіч|мужск|унісекс|унисекс|unisex)).*(жіноч|женск|для дівч|для жінок|women)

