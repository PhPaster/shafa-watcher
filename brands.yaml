# База брендів Shafa Watcher. Додати бренд = додати блок у `brands`. Код міняти не треба.
# Бренд без id → python tools/lookup.py fill (підставить id сам). Категорії: python tools/lookup.py categories

settings:
  items_per_query: 100        # скільки найновіших товарів брати за один запит (сервер приймає до 500)
  max_pages: 3                # догортати, якщо вся сторінка нова (великий потік)
  request_delay_sec: 1.5      # пауза між запитами до Shafa
  photos: 3                   # 1 = фото з кнопкою «Відкрити»; 2–10 = альбом
  heartbeat_hour_kyiv: 9      # щоденний звіт «я працюю» після цієї години за Києвом
  empty_runs_alert: 12        # алерт, якщо група, що раніше мала товари, повертає 0 стільки запусків поспіль
  max_brands_per_query: 50

# Профіль розмірів: діє для всіх брендів і пошуків (серверний фільтр, групи об'єднуються через АБО).
# одяг: XS S M L XL XXL 3XL… (або 48 = L) · штани: W28…W50 · взуття: 36…50, з половинками (42.5)
my_sizes:
  одяг: [L, XL]
  штани: [W32, W33]
  взуття: [43]

# За замовчуванням для всіх брендів і пошуків (кожен може перевизначити).
defaults:
  section: men                # men (словники розмірів і категорій є лише для men)
  min_condition: 3            # 1 Новий, 2 Ідеальний, 3 Дуже хороший, 4 Хороший, 5 Задовільний (3 = «3 і краще»)
  max_age_hours: 72           # ігнорувати «підняті» оголошення, створені раніше

# ПРИКЛАДИ (розділ 10.3 біблії). Заміни на свої бренди й правила.
brands:
  - name: Kapital
    id: 50311
    categories: [джинси]

  - name: COS
    id: 1956
    categories: [джинси, футболки, светри]
    max_price: 2500

  - name: ARKET               # без categories = усе в моїх розмірах
    id: 45928

  - name: Visvim
    id: 64003
    searches:                 # винятки: кілька окремих пошуків для одного бренду
      - name: взуття
        categories: [взуття]
        sizes: {взуття: [42.5, 43]}   # замінює лише взуття в профілі
      - categories: [джинси, сорочки]

# Пошуки за категорією без бренду (опційно).
searches:
  - name: Вовняні светри
    categories: [светри]
    materials: [вовна, кашемір]       # серверний фільтр: лише де продавець заповнив поле «Матеріал»
    materials_include: "(?<!ба)вовн|шерст|кашемір|merino|wool|cashmere"   # перевірка за назвою, описом і полем
    max_price: 2000
