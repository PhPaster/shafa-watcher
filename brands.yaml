# База брендів Shafa Watcher.
# Додати бренд = додати блок у `brands`. Код міняти не треба.
# Як знайти id бренду, розмірів і матеріалів: python tools/lookup.py --help (див. README).

settings:
  items_per_query: 100        # скільки найновіших товарів брати за один запит (сервер приймає до 500)
  max_pages: 3                # догортати, якщо вся сторінка нова (великий потік)
  request_delay_sec: 1.5      # пауза між запитами до Shafa
  photos: 3                   # 1 = фото з кнопкою «Відкрити»; 2–10 = альбом
  heartbeat_hour_kyiv: 9      # щоденний звіт «я працюю» після цієї години за Києвом
  empty_runs_alert: 12        # алерт, якщо група повертає 0 товарів стільки запусків поспіль
  max_brands_per_query: 50

# Значення за замовчуванням для всіх брендів (кожен бренд може перевизначити).
defaults:
  section: men                # men | women | kids | men/kofti | ... ; null = усі розділи
  sizes: []                   # id фільтра розмірів; для men: 147 XS/42, 148 S/44, 149 M/46, 150 L/48, 151 XL/50, 152 XXL/52
  min_condition: null         # 1 Новий, 2 Ідеальний, 3 Дуже хороший, 4 Хороший, 5 Задовільний (3 = «3 і краще»)
  max_price: null             # грн
  max_age_hours: 72           # ігнорувати «підняті» оголошення, створені раніше (null = не ігнорувати)

# ПРИКЛАДИ. Заміни на свої бренди й правила.
brands:
  - name: ARKET
    id: 45928
    sizes: [149, 150, 151]          # M, L, XL

  - name: COS
    id: 1956
    sizes: [149, 150, 151]
    materials_include: "(?<!ба)вовн|шерст|кашемір|мерінос|merino|wool|cashmere"   # назва + опис + поле «Матеріал»; (?<!ба) — щоб «бавовна» не рахувалась як вовна

  - name: Uniqlo
    id: 386
    sizes: [149, 150, 151]
    min_condition: 3                # Новий / Ідеальний / Дуже хороший
    max_price: 1500

  - name: Massimo Dutti
    id: 595
    enabled: false                  # вимкнений бренд не опитується
